<body>
    <header class="cabecalho">
        <!-- Aqui entrarão a logo e os links -->

            Shoyu Sushi <!-- Pode usar qualquer imagem salva na pasta img/ -->
            
        <div>
            
        </div>
        </div>

<section class="mais-pedidos">
    <h2>Mais pedidos</h2>
    
    <div class="cards-container">
        <!-- Card 1 -->
        <div class="card-item">
            <img src="./img/Nigiri, imagem 3 2.png" alt="Salmão Nigiri">
            <h3>Salmão Nigiri</h3>

        <!-- Card 2 -->

        </div>

        <!-- Card 3 -->
